name: Selenium E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes no ${{ matrix.browser }}
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Publicar relatórios e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.browser }}
          path: |
            target/surefire-reports
            target/screenshots
